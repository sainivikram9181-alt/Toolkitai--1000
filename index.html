<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolkitAI - 6 Free Tools in One Place</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-50">
<header class="bg-white shadow sticky top-0 z-50">
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">
<h1 class="text-2xl font-black">Toolkit<span class="text-indigo-600">AI</span></h1>
<span class="text-sm bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-bold">6 Tools • No 404</span>
</div>
</header>
<main class="max-w-6xl mx-auto px-4 py-8">
<div class="text-center mb-10">
<h2 class="text-4xl font-bold">All Tools in One Page</h2>
<p class="text-gray-600">No new page needed - sab yahi kaam karega</p>
</div>
<div class="grid md:grid-cols-3 gap-4 mb-12">
<button onclick="document.getElementById('compressor').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">🗜️<b> Image Compressor</b></button>
<button onclick="document.getElementById('resizer').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">📐<b> Image Resizer</b></button>
<button onclick="document.getElementById('bgremover').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">✂️<b> BG Remover</b></button>
<button onclick="document.getElementById('pdftext').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">📄<b> PDF to Text + Counter</b></button>
<button onclick="document.getElementById('qr').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">🔳<b> QR Generator</b></button>
<button onclick="document.getElementById('json').scrollIntoView({behavior:'smooth'})" class="bg-white p-5 rounded-2xl border text-left">🧩<b> JSON Formatter</b></button>
</div>

<section id="compressor" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">1. Image Compressor</h3><input type="file" id="compInput" accept="image/*" class="mb-3"><div class="flex gap-2 mb-3">Quality: <input type="range" id="compQuality" min="0.1" max="1" step="0.1" value="0.7"><span id="compQVal">0.7</span></div><canvas id="compCanvas" class="hidden"></canvas><img id="compPreview" class="max-w-full rounded border mb-3 hidden"><button onclick="compressImage()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">Compress</button><a id="compDownload" class="hidden ml-3 bg-green-600 text-white px-5 py-2 rounded-lg" download="compressed.jpg">Download</a></section>

<section id="resizer" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">2. Image Resizer</h3><input type="file" id="resizeInput" accept="image/*" class="mb-3"><div class="flex gap-3 mb-3"><input type="number" id="resizeW" placeholder="Width" class="border p-2 rounded w-24"><input type="number" id="resizeH" placeholder="Height" class="border p-2 rounded w-24"></div><canvas id="resizeCanvas" class="border rounded mb-3"></canvas><button onclick="resizeImage()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">Resize</button><a id="resizeDownload" class="hidden ml-3 bg-green-600 text-white px-5 py-2 rounded-lg" download="resized.png">Download</a></section>

<section id="bgremover" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">3. Background Remover</h3><input type="file" id="bgInput" accept="image/*" class="mb-3"><canvas id="bgCanvas" class="border rounded mb-3 max-w-full"></canvas><button onclick="removeBG()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">Remove White BG</button><a id="bgDownload" class="hidden ml-3 bg-green-600 text-white px-5 py-2 rounded-lg" download="no-bg.png">Download PNG</a></section>

<section id="pdftext" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">4. PDF to Text + Word Counter</h3><input type="file" id="pdfInput" accept="application/pdf" class="mb-3"><button onclick="extractPDF()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg mb-3">Extract Text</button><textarea id="pdfOutput" class="w-full h-48 border p-3 rounded" placeholder="PDF text..."></textarea><textarea id="wordInput" oninput="countWords()" class="w-full h-32 border p-3 rounded mt-3" placeholder="Word count ke liye text..."></textarea><div class="mt-2 text-sm bg-gray-100 p-3 rounded">Words: <b id="wCount">0</b> | Chars: <b id="cCount">0</b></div></section>

<section id="qr" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">5. QR Generator</h3><input type="text" id="qrText" placeholder="Link ya text" class="border p-3 rounded w-full md:w-1/2 mb-3"><button onclick="makeQR()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">Generate QR</button><div id="qrcode" class="mt-4 bg-white p-4 inline-block border rounded"></div></section>

<section id="json" class="bg-white rounded-2xl p-6 border mb-8"><h3 class="text-xl font-bold mb-4">6. JSON Formatter</h3><textarea id="jsonInput" class="w-full h-48 border p-3 rounded font-mono" placeholder='{"name":"vikram"}'></textarea><div class="flex gap-2 mt-3"><button onclick="formatJSON()" class="bg-indigo-600 text-white px-5 py-2 rounded-lg">Format</button><button onclick="minifyJSON()" class="bg-gray-800 text-white px-5 py-2 rounded-lg">Minify</button></div><pre id="jsonOutput" class="w-full bg-gray-900 text-green-300 p-4 rounded mt-3 hidden"></pre></section>
</main>
<script>
document.getElementById('compQuality').oninput=e=>document.getElementById('compQVal').innerText=e.target.value;
let compFile;document.getElementById('compInput').onchange=e=>{compFile=e.target.files[0];const r=new FileReader();r.onload=ev=>{document.getElementById('compPreview').src=ev.target.result;document.getElementById('compPreview').classList.remove('hidden')};r.readAsDataURL(compFile)}
function compressImage(){if(!compFile)return alert('Image select karo');const q=parseFloat(document.getElementById('compQuality').value);const img=new Image();img.onload=()=>{const canvas=document.getElementById('compCanvas');canvas.width=img.width;canvas.height=img.height;canvas.getContext('2d').drawImage(img,0,0);canvas.toBlob(b=>{const url=URL.createObjectURL(b);const a=document.getElementById('compDownload');a.href=url;a.classList.remove('hidden');document.getElementById('compPreview').src=url;},'image/jpeg',q)};img.src=URL.createObjectURL(compFile);}
let resizeFile;document.getElementById('resizeInput').onchange=e=>{resizeFile=e.target.files[0];}
function resizeImage(){const w=parseInt(document.getElementById('resizeW').value),h=parseInt(document.getElementById('resizeH').value);if(!resizeFile||!w||!h)return alert('File+W+H do');const img=new Image();img.onload=()=>{const c=document.getElementById('resizeCanvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{const url=URL.createObjectURL(b);const a=document.getElementById('resizeDownload');a.href=url;a.classList.remove('hidden')},'image/png')};img.src=URL.createObjectURL(resizeFile);}
let bgFile;document.getElementById('bgInput').onchange=e=>{bgFile=e.target.files[0];const img=new Image();img.onload=()=>{const c=document.getElementById('bgCanvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0)};img.src=URL.createObjectURL(bgFile)}
function removeBG(){const c=document.getElementById('bgCanvas');const ctx=c.getContext('2d');const imgData=ctx.getImageData(0,0,c.width,c.height);const d=imgData.data;for(let i=0;i<d.length;i+=4){if(d[i]>230&&d[i+1]>230&&d[i+2]>230)d[i+3]=0;}ctx.putImageData(imgData,0,0);c.toBlob(b=>{const url=URL.createObjectURL(b);const a=document.getElementById('bgDownload');a.href=url;a.classList.remove('hidden')},'image/png');}
async function extractPDF(){const file=document.getElementById('pdfInput').files[0];if(!file)return alert('PDF select karo');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument(buf).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();text+=content.items.map(it=>it.str).join(' ')+'\n';}document.getElementById('pdfOutput').value=text;document.getElementById('wordInput').value=text;countWords();}
function countWords(){const t=document.getElementById('wordInput').value;document.getElementById('wCount').innerText=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById('cCount').innerText=t.length;}
function makeQR(){const txt=document.getElementById('qrText').value;if(!txt)return alert('Text daalo');document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:200,height:200});}
function formatJSON(){try{const obj=JSON.parse(document.getElementById('jsonInput').value);const out=document.getElementById('jsonOutput');out.innerText=JSON.stringify(obj,null,2);out.classList.remove('hidden');}catch(e){alert('Invalid JSON: '+e.message)}}
function minifyJSON(){try{const obj=JSON.parse(document.getElementById('jsonInput').value);const out=document.getElementById('jsonOutput');out.innerText=JSON.stringify(obj);out.classList.remove('hidden');}catch(e){alert('Invalid JSON')}}
</script>
</body>
</html>
