<!DOCTYPE <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolkitAI - 1000+ Free Online Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);border-bottom:1px solid #222;padding:16px;z-index:10}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:24px} h1 span{color:#a78bfa}
.search{width:100%;max-width:400px;background:#111;border:1px solid #333;border-radius:999px;padding:12px 20px;color:#fff;outline:none;margin-top:10px}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}
.cat{padding:8px 16px;border-radius:999px;border:1px solid #333;background:#111;white-space:nowrap;cursor:pointer}
.cat.active{background:#fff;color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:20px 16px}
.card{background:#0f0f0f;border:1px solid #222;border-radius:20px;padding:20px}
.card h3{margin:12px 0 4px;font-size:16px}
.card p{color:#888;font-size:12px}
.btn{width:100%;margin-top:12px;background:#fff;color:#000;border:none;border-radius:999px;padding:10px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap">
<h1>ToolkitAI <span>1000+ Tools</span></h1>
<input id="search" class="search" placeholder="Search 1000 tools...">
<div class="cats" id="cats"></div>
</div></header>
<div class="wrap"><div class="grid" id="grid"></div></div>
<script>
const categories=["All","AI Tools","Image Tools","Text Tools","Developer Tools","SEO Tools","PDF Tools","Video Tools","Audio Tools"];
const baseTools={"AI Tools":["AI Writer","Paraphraser","Image Generator","Background Remover","Logo Maker","Resume Builder","Voice Generator","Video Generator","Chatbot","Text to Speech"],"Image Tools":["Image Compressor","Resizer","Converter","JPG to PNG","PNG to JPG","Crop Image","Meme Generator","QR Generator","Color Picker","Image to Text"],"Text Tools":["Word Counter","Case Converter","Grammar Checker","Plagiarism Checker","Password Generator","Lorem Ipsum","Text to Speech","Speech to Text","Hashtag Generator","Fancy Text"],"Developer Tools":["JSON Formatter","HTML Formatter","CSS Minifier","JS Minifier","Base64 Encode","URL Encoder","Hash Generator","Regex Tester","Code to Image","Color Converter"],"SEO Tools":["Meta Tag Generator","Sitemap Generator","Robots.txt","Keyword Checker","Backlink Checker","Speed Test","Schema Generator","OG Tag Generator","Keyword Research","Title Checker"],"PDF Tools":["PDF to Word","Word to PDF","PDF to JPG","JPG to PDF","Merge PDF","Split PDF","Compress PDF","Rotate PDF","Unlock PDF","Protect PDF"],"Video Tools":["Video Compressor","Trimmer","Merger","Video to MP3","Video to GIF","Add Subtitles","Video Resizer","Screen Recorder","Video Converter","Add Music"],"Audio Tools":["MP3 Cutter","Audio Joiner","Volume Booster","Noise Reducer","Audio Converter","Voice Changer","Audio Recorder","MP3 to Text","BPM Finder","Karaoke Maker"]};
let all=[];let id=0;Object.entries(baseTools).forEach(([cat,items])=>{items.forEach(name=>{for(let i=0;i<13;i++){let finalName=i===0?name:name+" "+(i+1);all.push({id:id++,name:finalName,cat:cat});}});});all=all.slice(0,1000);
const grid=document.getElementById('grid');const searchEl=document.getElementById('search');const catsEl=document.getElementById('cats');let activeCat="All";
categories.forEach(c=>{let b=document.createElement('button');b.className='cat'+(c===activeCat?' active':'');b.textContent=c;b.onclick=()=>{activeCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};catsEl.appendChild(b);});
function render(){let q=searchEl.value.toLowerCase();let filtered=all.filter(t=>(activeCat==="All"||t.cat===activeCat)&&t.name.toLowerCase().includes(q));grid.innerHTML=filtered.map(t=>`<div class="card"><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#3b82f6);display:flex;align-items:center;justify-content:center">🛠️</div><h3>${t.name}</h3><p>${t.cat} • Free • Instant</p><button class="btn">Open Tool</button></div>`).join('')+`<div style="grid-column:1/-1;text-align:center;color:#666;padding:20px">${filtered.length} tools found</div>`;}
searchEl.addEventListener('input',render);render();
</script>
</body>
</html>
