<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="google-site-verification" content="V5OGhqnZZGYOsxRNCHSIix2_fkxRXpdXoi3TEzd54Tk" />
<title>ToolkitAI - 1 Lakh AI Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap'); body{font-family:'Space Grotesk',sans-serif}</style>
</head>
<body class="bg-[#0A0A0F] text-white">
<header class="flex justify-between p-5 max-w-7xl mx-auto items-center"><div class="font-bold text-2xl">ToolkitAI 🚀</div><div class="bg-[#1A1A22] border border-[#2A2A32] px-4 py-2 rounded-full text-sm">1,00,000+ Tools LIVE</div></header>

<section class="text-center py-10 px-4">
<h1 class="text-5xl md:text-7xl font-bold leading-tight">World's First<br><span class="bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">Play Store for AI</span></h1>
<p class="text-gray-400 mt-4">Search from 1 Lakh AI tools</p>
<input id="search" placeholder="Search 1 Lakh tools... (e.g. ChatGPT, Image Gen)" class="mt-8 w-full max-w-2xl bg-[#1A1A22] border border-[#2A2A32] rounded-full py-4 px-6 focus:border-violet-500 outline-none">
<div class="flex gap-2 justify-center mt-6 flex-wrap" id="cats">
<button onclick="filterCat('all')" class="catBtn bg-white text-black px-5 py-2 rounded-full font-bold">All</button>
<button onclick="filterCat('Productivity')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Productivity</button>
<button onclick="filterCat('Image')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Image</button>
<button onclick="filterCat('Writing')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Writing</button>
<button onclick="filterCat('Video')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Video</button>
<button onclick="filterCat('Coding')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Coding</button>
<button onclick="filterCat('Business')" class="catBtn bg-[#1A1A22] px-5 py-2 rounded-full">Business</button>
</div>
</section>

<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-7xl mx-auto px-4"></div>
<div class="text-center py-10"><button id="loadMore" class="bg-violet-600 hover:bg-violet-700 px-10 py-3 rounded-full font-bold">Load More Tools</button><p id="status" class="text-gray-500 mt-3 text-sm"></p></div>

<script>
const SUPABASE_URL = 'https://wegakcebrpkwfmamfsvo.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_BzGl6R4HFUdl30N03E6QRg_K5uBsUpN';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let page=0, cat='all', q='';

async function load(reset=false){
 if(reset){page=0; document.getElementById('grid').innerHTML='';}
 document.getElementById('status').innerText='Loading 1 Lakh tools...';
 let query = client.from('tools').select('*').order('id').range(page*40, (page+1)*40-1);
 if(cat!='all') query=query.eq('category',cat);
 if(q) query=query.ilike('name','%'+q+'%');
 const {data, error} = await query;
 if(error){ document.getElementById('status').innerText='Error: '+error.message; return; }
 if(data.length==0 && page==0) document.getElementById('status').innerText='No tools found. Category change karo.';
 data.forEach(t=>{
  document.getElementById('grid').innerHTML+=`
  <div class="bg-[#12121A] border border-[#222230] rounded-2xl p-4 hover:border-violet-500/50 transition">
  <div class="flex justify-between text-[11px]"><span class="bg-[#1E1E2E] px-2 py-1 rounded-full">${t.category||'AI'}</span><span class="text-yellow-400">★ ${Number(t.rating||4.5).toFixed(1)}</span></div>
  <h3 class="font-bold mt-3 truncate text-[15px]">${t.name}</h3>
  <p class="text-[11px] text-gray-400 mt-1 line-clamp-2 h-8">${t.short_desc||''}</p>
  <div class="flex justify-between items-center mt-3"><span class="text-[10px] bg-violet-500/20 text-violet-300 px-2 py-1 rounded">${t.pricing||'Free'}</span><a href="${t.website_url}" target="_blank" class="bg-white text-black text-[11px] font-bold px-3 py-1.5 rounded-full">Visit →</a></div>
  </div>`;
 });
 document.getElementById('status').innerText=`Showing ${ (page+1)*40 } / 100000 tools - ${cat} ${q ? 'for '+q : ''}`;
 page++;
}
function filterCat(c){
 cat=c;
 document.querySelectorAll('.catBtn').forEach(b=>{b.className='catBtn bg-[#1A1A22] px-5 py-2 rounded-full';});
 event.target.className='catBtn bg-white text-black px-5 py-2 rounded-full font-bold';
 load(true);
}
document.getElementById('search').oninput=e=>{q=e.target.value; load(true);}
document.getElementById('loadMore').onclick=()=>load();
load(true);
</script>
</body>
</html>
