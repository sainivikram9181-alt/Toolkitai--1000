<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolkitAi 1000 - Real AI</title>
<style>
body{font-family:system-ui;background:#0f0f12;color:#fff;margin:0;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center}
.card{background:#1d1d21;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #333}
.btn{background:#fff;color:#000;border:0;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer}
.btn2{background:#333;color:#fff}
.chatBox{height:300px;overflow-y:auto;background:#111;padding:12px;border-radius:12px;margin:10px 0}
.inputRow{display:flex;gap:8px}
.inputRow input{flex:1;padding:12px;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
.toolGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolCard{background:#1d1d21;padding:14px;border-radius:12px;border:1px solid #333;text-align:center}
</style>
</head>
<body>
<div class="header"><h2>🚀 ToolkitAi 1000</h2><button class="btn" onclick="document.getElementById('ideaModal').style.display='block'">+ AI Idea</button></div>

<div class="card">
<h3>💬 Super Chat - 100% REAL</h3>
<div id="chatBox" class="chatBox"><div>Namaste! Main Real AI hu. ABCD, 1-100, Code, GST sab pucho!</div></div>
<div class="inputRow">
<input id="chatInput" placeholder="Yahan likho... jaise ABCD likho">
<button class="btn" onclick="sendRealChat()">Send</button>
</div>
<small style="color:#666;">Key 1 baar puchega fir lifetime save rahega</small>
</div>

<div id="toolsArea" class="toolGrid"></div>

<div id="ideaModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);padding:20px;z-index:99;">
<div class="card" style="margin-top:50px;">
<h3>🚀 AI Idea se Real Tool Banao</h3>
<input id="ideaInput" placeholder="Jaise: QR Code Generator, Age Calculator" style="width:100%;padding:12px;border-radius:10px;background:#222;color:#fff;border:1px solid #444;">
<br><br>
<button class="btn" onclick="createRealTool()">Instant Generate Tool 🚀</button>
<button class="btn btn2" onclick="document.getElementById('ideaModal').style.display='none'" style="margin-left:8px;">Close</button>
<div id="ideaResult" style="margin-top:15px;color:#aaa;"></div>
</div>
</div>

<script>
// ========= API INCLUDED - REAL GEMINI =========
let GEMINI_KEY = localStorage.getItem('toolkitai_gemini_key') || '';
async function getGeminiKey(){
  if(GEMINI_KEY) return GEMINI_KEY;
  let k = prompt("Pehli baar API Key daalo (AQ...M2YA wali):");
  if(k){ localStorage.setItem('toolkitai_gemini_key', k.trim()); GEMINI_KEY = k.trim(); return GEMINI_KEY; }
  return null;
}
async function callGemini(promptText){
  let key = await getGeminiKey(); if(!key) return "❌ Key nahi dali! Fir se try karo.";
  try{
    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:promptText}]}]})
    });
    let data = await res.json();
    if(data.error) return "Error: "+data.error.message+" - Key check karo!";
    return data.candidates[0].content.parts[0].text;
  }catch(e){ return "Network Error: "+e.message; }
}
// ========= SUPER CHAT REAL =========
async function sendRealChat(){
  let input=document.getElementById('chatInput');
  let box=document.getElementById('chatBox');
  if(!input.value.trim()) return;
  let q=input.value; input.value='';
  box.innerHTML+=`<div style="margin:8px 0"><b style="color:#7cf">Tum:</b> ${q}</div>`;
  box.innerHTML+=`<div id="tempLoad" style="margin:8px 0;color:#aaa">AI soch raha hai...</div>`;
  box.scrollTop=box.scrollHeight;
  let ans=await callGemini(q);
  document.getElementById('tempLoad').remove();
  box.innerHTML+=`<div style="margin:8px 0"><b style="color:#0f0">ToolkitAi:</b><br>${ans.replace(/\n/g,'<br>')}</div>`;
  box.scrollTop=box.scrollHeight;
}
// ========= AI IDEA REAL TOOL =========
async function createRealTool(){
  let idea=document.getElementById('ideaInput').value;
  let resDiv=document.getElementById('ideaResult');
  if(!idea) return alert("Idea likho pehle!");
  resDiv.innerHTML="⏳ Real Tool ban raha hai... 10 sec";
  let prompt=`Ek pura working single HTML tool bana: "${idea}". Sirf <div> ke andar ka working HTML+CSS+JS code de. Input, button, calculation sab working hona chahiye. Example: GST Calculator ho to amount*18% ka logic.`;
  let toolCode=await callGemini(prompt);
  let toolsArea=document.getElementById('toolsArea');
  toolsArea.innerHTML=`<div class="card" style="grid-column:1/-1;">${toolCode}</div>`+toolsArea.innerHTML;
  resDiv.innerHTML="✅ Ban gaya! Modal band karke dekho neeche!";
}
// ========= 2000 TOOLS DEMO LOAD (Tere 203 line wale yahan safe rahenge) =========
let demoTools=["GST Calculator","Age Calculator","BMI Calculator","QR Generator","Word Counter","Password Gen","EMI Calculator","Unit Converter","SIP Calculator","Love Calculator"];
let toolsArea=document.getElementById('toolsArea');
demoTools.forEach(t=>{ toolsArea.innerHTML+=`<div class="toolCard">${t}</div>`; });
</script>
</body>
</html>
