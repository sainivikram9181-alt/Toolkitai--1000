<!DOCTYPE html>
<html><body style="background:#000;color:#fff;text-align:center;padding:50px;font-family:sans-serif">
<h2>1000 Pages Sitemap Generator</h2>
<button id="btn" style="padding:20px 40px;font-size:20px;background:#a855f7;color:#fff;border:none;border-radius:10px;">CLICK TO COPY 1000 URLs SITEMAP</button>
<p id="msg"></p>
<script>
document.getElementById('btn').onclick=()=>{
let x='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n  <url><loc>https://toolkitai.in/</loc><lastmod>2026-10-11</lastmod><priority>1.0</priority></url>\n';for(let i=1;i<=1000;i++)x+=`  <url><loc>https://toolkitai.in/tool/${i}</loc><lastmod>2026-10-11</lastmod><priority>0.8</priority></url>\n`;x+='</urlset>';navigator.clipboard.writeText(x).then(()=>{document.getElementById('msg').innerHTML='✅ 1000 URLs COPIED! <br><br>Ab GitHub pe jake public/sitemap.xml me paste kar de!';});
}
</script>
</body></html>
