<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AI Insta - Real Insta Clone</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial}
body{background:#000;color:#fff;display:flex;justify-content:center}
.app{width:100%;max-width:430px;background:#000;min-height:100vh;border:1px solid #111;position:relative}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #262626;position:sticky;top:0;background:#000;z-index:10}
.top b{font-family:'Brush Script MT',cursive;font-size:32px;font-weight:400;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top i{font-size:22px;margin-left:16px}
.stories{padding:10px 0 10px 8px;display:flex;gap:12px;overflow-x:auto;border-bottom:1px solid #121212;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{text-align:center;min-width:62px;cursor:pointer}
.story img{width:56px;height:56px;border-radius:50%;padding:2px;border:2px solid #feda75;object-fit:cover;background:#111}
.story p{font-size:10px;margin-top:4px;color:#ccc}
.id-bar{display:none}
.ai-box{margin:12px;background:#0a0a0a;border:1px solid #262626;border-radius:12px;padding:12px}
.ai-box textarea{width:100%;background:#000;border:1px solid #262626;border-radius:8px;padding:10px;color:#fff;font-size:13px;outline:none;resize:none}
.ai-box .btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.gold{background:#fff;color:#000}
.dark{background:#262626;color:#fff}
#loader{display:none;text-align:center;padding:10px;font-size:12px;color:#feda75}
.feed{padding-bottom:80px}
.post{border-bottom:1px solid #262626}
.post-h{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.post-h-l{display:flex;align-items:center;gap:8px;cursor:pointer}
.post-h-l img{width:32px;height:32px;border-radius:50%;border:1px solid #333;object-fit:cover}
.post-h-l b{font-size:13px}
.post-h-l span{font-size:10px;color:#8e8e8e}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111;display:block}
.post-actions{padding:8px 12px;display:flex;justify-content:space-between}
.post-actions-l i{font-size:22px;margin-right:14px;cursor:pointer}
.post-actions-r i{font-size:22px;cursor:pointer}
.likes{padding:0 12px;font-size:13px;font-weight:600}
.cap{padding:4px 12px 12px;font-size:13px;line-height:18px}
.cap span{color:#8e8e8e}
.bot-nav{position:fixed;bottom:0;width:100%;max-width:430px;height:50px;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bot-nav i{font-size:22px;cursor:pointer}
.active{color:#fff}
.dp-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.dp-modal img{width:300px;height:300px;border-radius:50%;object-fit:cover;border:4px solid #fff}
</style>
</head>
<body>
<div class="app">
<div class="top"><b>AI Insta</b><div><i class="fa-regular fa-heart"></i><i class="fa-regular fa-paper-plane"></i></div></div>

<div class="stories" id="stories">
<div class="story" onclick="changeDP()"><img id="s1" src=""><p>Your Story</p></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=5"><p>jaipur_ai</p></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=8"><p>ai_creator</p></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=12"><p>toolkit_ai</p></div>
<div class="story"><img src="https://i.pravatar.cc/100?img=15"><p>vikram.ai</p></div>
</div>

<div class="ai-box">
<textarea id="prompt" rows="2" placeholder="What do you want AI to create? Ex: A lion in suit at Hawa Mahal, cinematic"></textarea>
<div id="loader"><i class="fa-solid fa-spinner fa-spin"></i> AI is creating... 4 sec</div>
<div class="btns">
<button class="btn gold" onclick="createPost()">+ AI POST</button>
<button class="btn dark" onclick="createVideo()">AI REEL</button>
</div>
<p style="font-size:9px;color:#555;margin-top:6px">100% AI • No Gallery • Just Prompt • ToolkitAI ID</p>
</div>

<div class="feed" id="feed"></div>

<div class="bot-nav">
<i class="fa-solid fa-house active"></i>
<i class="fa-solid fa-magnifying-glass" onclick="alert('Search: AI se search jald ayega')"></i>
<i class="fa-regular fa-square-plus" onclick="document.getElementById('prompt').focus();window.scrollTo(0,0)"></i>
<i class="fa-solid fa-clapperboard" onclick="alert('Reels: AI Reels jald')"></i>
<i class="fa-regular fa-user" onclick="openProfile()"></i>
</div>
</div>

<div class="dp-modal" id="dpModal" onclick="this.style.display='none'">
<img id="bigDP" src="">
<p style="margin-top:15px">VIKRAM SAINI • Diamond 💎</p>
<button class="btn gold" style="margin-top:15px;width:200px" onclick="event.stopPropagation();changeDP()">Change DP</button>
</div>

<input type="file" id="dpInput" accept="image/*" style="display:none" onchange="uploadDP(event)">

<script>
let myDP = localStorage.getItem("myDP") || "https://i.pravatar.cc/100?img=32";
let myName = "VIKRAM SAINI";
let myId = "Tk0448-3308";
document.getElementById("s1").src = myDP;

function changeDP(){document.getElementById("dpInput").click();}
function uploadDP(e){
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=ev=>{
  myDP=ev.target.result;
  localStorage.setItem("myDP",myDP);
  document.getElementById("s1").src=myDP;
  document.querySelectorAll(".p-dp").forEach(i=>i.src=myDP);
  document.getElementById("bigDP").src=myDP;
  alert("DP Updated 💎");
 };
 r.readAsDataURL(f);
}
function openProfile(){
 document.getElementById("bigDP").src=myDP;
 document.getElementById("dpModal").style.display="flex";
}

function postHTML(img,caption){
 const liked = Math.floor(Math.random()*500+50);
 return `<div class="post">
 <div class="post-h"><div class="post-h-l" onclick="openProfile()"><img class="p-dp" src="${myDP}"><div><b>${myName}</b><br><span>Jaipur • Real AI • ${myId}</span></div></div><i class="fa-solid fa-ellipsis"></i></div>
 <img class="post-img" src="${img}" ondblclick="this.nextElementSibling.firstElementChild.firstElementChild.style.color='#ff3040'">
 <div class="post-actions"><div class="post-actions-l"><i class="fa-regular fa-heart" onclick="this.classList.toggle('fa-solid');this.style.color=this.classList.contains('fa-solid')?'#ff3040':'#fff'"></i><i class="fa-regular fa-comment"></i><i class="fa-regular fa-paper-plane"></i></div><div class="post-actions-r"><i class="fa-regular fa-bookmark" onclick="this.classList.toggle('fa-solid')"></i></div></div>
 <div class="likes">${liked} likes</div>
 <div class="cap"><b>${myName.toLowerCase()}</b> ${caption} <span>#aiinsta #toolkitai #realai #jaipur</span></div>
 </div>`;
}

function createPost(){
 let p=document.getElementById("prompt").value.trim();
 if(!p){alert("Prompt likho bhai! Ex: lion in Jaipur");return;}
 document.getElementById("loader").style.display="block";
 let seed=Math.floor(Math.random()*999999);
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+", instagram photo, highly detailed, photorealistic, 4k")}?width=600&height=600&seed=${seed}&model=flux&nologo=true`;
 let feed=document.getElementById("feed");
 // add instantly, hide loader on load
 let div=document.createElement("div");
 div.innerHTML=postHTML(url, p);
 feed.prepend(div);
 document.getElementById("prompt").value="";
 setTimeout(()=>{document.getElementById("loader").style.display="none";},2000);
 window.scrollTo(0,200);
}

function createVideo(){
 let p=document.getElementById("prompt").value.trim();
 if(!p){alert("Reel ke liye prompt likho!");return;}
 alert("AI Video (Reels) jald ayega! Abhi ke liye AI Post bana raha hu, use hi Reels samjho!");
 createPost();
}

window.onload=()=>{
 let first=`https://image.pollinations.ai/prompt/futuristic%20Jaipur%20city%20Hawa%20Mahal%20flying%20cars%20cinematic%20instagram?width=600&height=600&seed=1`;
 document.getElementById("feed").innerHTML=postHTML(first,"Welcome to Real AI Instagram! Bas prompt likho, AI khud post bana dega! No gallery needed. DP change karne ke liye Your Story pe click karo! 🚀");
}
</script>
</body>
</html>
