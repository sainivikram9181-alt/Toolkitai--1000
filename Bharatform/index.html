function renderGrid(filter=""){
let g=document.getElementById('formGrid'); g.innerHTML="";
let count=0;
for(let k in ALL_FORMS){let f=ALL_FORMS[k];
if(filter &&!f.name.toLowerCase().includes(filter) &&!f.cat.toLowerCase().includes(filter)) continue;
count++;
g.innerHTML+=`<div class="card" onclick="setTask('Mera ${f.name} ka form bhar de')"><span class="tag">${f.cat}</span><br><b>${f.name}</b><br><span style="color:#888">${f.docs} | ₹${f.fees}</span></div>`;
}
document.getElementById('total').innerText=count;
}
renderGrid();
document.getElementById('task').addEventListener('input',e=>renderGrid(e.target.value.toLowerCase()));
function setTask(t){document.getElementById('task').value=t; startAgent();}

function enablePush(){
Notification.requestPermission().then(p=>{
if(p==='granted'){
let s=parseInt(localStorage.getItem('bf_sent')||0)+1; localStorage.setItem('bf_sent',s); updateDash();
new Notification("BharatForm 100+ Active 🇮🇳",{body:"105 form ka agent ON hai! 8952830448"});
alert("Push ON - Ab 100+ form ka notification jayega");
}});
}
function updateDash(){
document.getElementById('sent').innerText=localStorage.getItem('bf_sent')||0;
document.getElementById('clicks').innerText=localStorage.getItem('bf_clicks')||0;
}
updateDash();

function startAgent(){
let userTask=document.getElementById('task').value; if(!userTask) return alert('Pehle form likh');
let low=userTask.toLowerCase(); let type='udyam';
for(let k in ALL_FORMS){ if(low.includes(k.split('_')[0]) || ALL_FORMS[k].name.toLowerCase().includes(low.split(' ')[0])){ type=k; break; } }
if(low.includes('police')) type='raj_police'; if(low.includes('udyam')) type='udyam'; if(low.includes('pan')) type='pan'; if(low.includes('railway')) type='rail_groupd';
let form=ALL_FORMS[type];
let box=document.getElementById('result'); box.style.display='block';
box.innerHTML=`🤖 BharatForm 100+ Agent LIVE\n✅ Task: ${userTask}\n✅ Detect: ${form.name} (${form.cat})\n✅ Docs: ${form.docs}\n✅ Fees: ${form.fees} Rs\n\nWhatsApp 8952830448 pe bhej raha hu...`;
let c=parseInt(localStorage.getItem('bf_clicks')||0)+1; localStorage.setItem('bf_clicks',c); updateDash();

setTimeout(()=>{ window.open(`https://wa.me/918952830448?text=${encodeURIComponent(waMsg)}`,"_blank"); }, 700);
}
